name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Publish entrypoints for the static routes used by BrowserRouter.
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/messages dist/rich-menus dist/rich-menus/new
          cp dist/index.html dist/messages/index.html
          cp dist/index.html dist/rich-menus/index.html
          cp dist/index.html dist/rich-menus/new/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
